[project]
name = "drumscript-runner"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "drumscript>=0.2.1",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
]

# Linux (the production containers) installs CPU-only torch: PyPI's Linux
# torch wheels pull several GB of CUDA libraries the deployment doesn't use.
# Other platforms keep resolving torch from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
